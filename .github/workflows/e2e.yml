name: Browser journey
on:
  push:
    branches: [main, master, codex/variant-3]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      HEADLESS: '1'
      BROWSER: chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest lab07 -v --html=artifacts/browser.html --self-contained-html
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-results
          path: artifacts/
