name: Module validation
on:
  push:
    branches: [main, master, codex/variant-3]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest lab06 -v --junitxml=artifacts/module.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: module-results
          path: artifacts/module.xml
